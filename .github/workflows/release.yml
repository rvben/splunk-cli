name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: make check
      - name: Verify tag matches package version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag/version mismatch'
          PY
  wheels:
    name: Wheel (${{ matrix.target }})
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: auto
          - os: macos-14
            target: x86_64-apple-darwin
            manylinux: auto
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Validate wheel metadata
        run: uvx --from twine==6.2.0 twine check --strict dist/*.whl
      - name: Smoke test installed wheel
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke --no-index --find-links dist splunk-cli
          uv run --no-project --python .wheel-smoke -- splunk-cli --version
          uv run --no-project --python .wheel-smoke -- splunk-cli schema jobs results
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
  sdist:
    name: Source distribution
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uvx --from twine==6.2.0 twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
  publish-pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: artifacts
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Publish all wheels and source distribution
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple artifacts/wheel-*/*.whl artifacts/sdist/*.tar.gz
