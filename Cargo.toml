[package]
name = "splunk-cli"
version = "0.0.3"
edition = "2024"
rust-version = "1.90"
description = "Search and manage Splunk from the terminal with structured, agent-friendly output"
authors = ["Ruben J. Jongejan <ruben.jongejan@gmail.com>"]
license = "MIT"
repository = "https://github.com/rvben/splunk-cli"
homepage = "https://github.com/rvben/splunk-cli"
keywords = ["splunk", "cli", "search", "logs", "clispec"]
categories = ["command-line-utilities"]
readme = "README.md"

[lib]
name = "splunk_cli"
path = "src/lib.rs"

[[bin]]
name = "splunk-cli"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
futures-util = "0.3"
keyring = "4.2"
rpassword = "7"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time", "signal"] }
tokio-tungstenite = "0.30"
toml = "1.1"
unicode-width = "0.2"
terminal_size = "0.4"

[dev-dependencies]
wiremock = "0.6"
jsonschema = { version = "0.46", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
