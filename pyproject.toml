[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "splunk-cli"
dynamic = ["version"]
description = "Search and manage Splunk from the terminal with structured, agent-friendly output"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ruben J. Jongejan" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rvben/splunk-cli"
Repository = "https://github.com/rvben/splunk-cli"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
